# CI pipeline (TECHNICAL_DESIGN §14). The E2E job is added with the first Playwright test.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (mvnw verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Unit + Testcontainers integration tests (Docker is available on ubuntu-latest) + Spotless.
      - run: ./mvnw -B verify

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  contract:
    name: API contract (schema.d.ts up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Export the OpenAPI spec
        working-directory: backend
        run: ./mvnw -B test -Dtest=OpenApiSpecTest
      - name: Regenerate the client
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
      - name: Fail if the committed client is stale
        run: |
          if ! git diff --exit-code -- frontend/src/api/schema.d.ts; then
            echo "::error file=frontend/src/api/schema.d.ts::schema.d.ts is out of date. Run './mvnw test -Dtest=OpenApiSpecTest' in backend/, then 'npm run generate:api' in frontend/, and commit the result."
            exit 1
          fi

  images:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
