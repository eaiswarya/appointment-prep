# Single entry point (TECHNICAL_DESIGN §3): serves the SPA and proxies /api to the backend.

# Keep the client's X-Request-Id; generate one only when it's missing. The backend rejects unsafe values.
map $http_x_request_id $req_id {
  default $http_x_request_id;
  ""      $request_id;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The backend's context path is /api, so the path is passed through unchanged.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $req_id;
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback: client-side routes get index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
