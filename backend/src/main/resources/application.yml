server:
  servlet:
    # The API base path (TECHNICAL_DESIGN §9). Actuator and the API docs live under it too.
    context-path: /api

spring:
  application:
    name: appointment
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  datasource:
    # Docker Compose overrides the URL with SPRING_DATASOURCE_URL. Credentials come from env vars only.
    url: jdbc:postgresql://localhost:5432/appointments
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

app:
  # Public URL of the app, used for links in emails (TECHNICAL_DESIGN §12.3).
  base-url: ${APP_BASE_URL:http://localhost:8080}
  jwt:
    # HS256 signing key, at least 256 bits. From the environment only (TECHNICAL_DESIGN §12.3).
    secret: ${APP_JWT_SECRET:}
  admin:
    # Bootstrap admin, created on first start if no admin exists (§12.3). From the environment only.
    email: ${APP_ADMIN_EMAIL:}
    initial-password: ${APP_ADMIN_INITIAL_PASSWORD:}
  rate-limit:
    # Per-IP limits on login and forgot-password (TECHNICAL_DESIGN §8.3). Off only in tests.
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# API docs are dev-only; see application-dev.yml.
springdoc:
  api-docs:
    enabled: false
    path: /docs/openapi.json
  swagger-ui:
    enabled: false
    path: /docs
  # Stable key order so the exported spec and the generated client don't churn.
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

logging:
  pattern:
    # Request ID from RequestIdFilter on every log line (TECHNICAL_DESIGN §13).
    level: "%5p [%X{requestId:-}]"
