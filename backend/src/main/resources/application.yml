server:
  servlet:
    # The API base path (TECHNICAL_DESIGN §9). Actuator and the API docs live under it too.
    context-path: /api

spring:
  application:
    name: appointment
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  datasource:
    # Docker Compose overrides the URL with SPRING_DATASOURCE_URL. Credentials come from env vars only.
    url: jdbc:postgresql://localhost:5432/appointments
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# API docs are dev-only; see application-dev.yml.
springdoc:
  api-docs:
    enabled: false
    path: /docs/openapi.json
  swagger-ui:
    enabled: false
    path: /docs
  # Stable key order so the exported spec and the generated client don't churn.
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

logging:
  pattern:
    # Request ID from RequestIdFilter on every log line (TECHNICAL_DESIGN §13).
    level: "%5p [%X{requestId:-}]"
